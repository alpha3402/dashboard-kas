<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Membersihkan cache…</title>
<meta name="theme-color" content="#0d1117">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:420px;width:100%;background:#161b22;border:1px solid #30363d;
  border-radius:14px;padding:22px;text-align:center}
h1{font-size:17px;margin:0 0 8px}
p{font-size:13px;color:#8b949e;margin:0 0 16px;line-height:1.55}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;
  background:#238636;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:9px}
.btn.alt{background:#21262d;border:1px solid #30363d;color:#e6edf3}
.steps{text-align:left;font-size:12.5px;color:#8b949e;background:#0d1117;
  border:1px solid #30363d;border-radius:8px;padding:12px;margin-top:14px;line-height:1.65}
.steps b{color:#e6edf3}
#log{font:12px/1.6 ui-monospace,monospace;margin-top:14px;text-align:left;
  white-space:pre-wrap;min-height:18px;color:#3fb950}
.warn{color:#d29922}
</style>
</head>
<body>
<div class="box">
  <h1>🔄 Memperbaiki Dashboard Kas…</h1>
  <p id="sub">Membersihkan cache lama. Mohon tunggu sebentar, halaman akan
     terbuka sendiri.</p>

  <button class="btn" id="open" style="display:none">Buka App Sekarang</button>
  <button class="btn alt" id="diag" style="display:none">Cek Koneksi Server</button>

  <div class="steps" id="manualBox" style="display:none">
    <b>Kalau app belum terbuka:</b><br><span id="manual"></span>
  </div>

  <div id="log"></div>
</div>

<script>
const log=(m,cls)=>{const e=document.getElementById('log');e.textContent=m;e.className=cls||''};
const ua=navigator.userAgent;
const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
document.getElementById('manual').innerHTML = isIOS
  ? 'iPhone: <b>Setelan → Safari → Lanjutan → Data Situs Web → cari “alpha3402” → Hapus</b>, lalu buka link app lagi.'
  : 'Chrome: tap <b>ikon 🔒 di address bar → Setelan situs → Hapus &amp; setel ulang</b>, lalu buka link app lagi.';

async function clean(){
  let n=0;
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      for(const r of rs){ await r.unregister(); n++; }
    }
    if(window.caches){
      const ks=await caches.keys();
      for(const k of ks){ await caches.delete(k); }
    }
  }catch(e){ log('⚠️ '+e.message,'warn'); }
  try{ localStorage.removeItem('dk_api_v1'); }catch(e){}
  return n;
}

async function run(){
  log('membersihkan cache…');
  const n = await clean();
  log('✅ selesai ('+n+' service worker dibersihkan)\nmembuka app…');
  // ganti URL supaya benar-benar fresh
  const dest='./index.html?fresh='+Date.now();
  document.getElementById('open').style.display='block';
  document.getElementById('diag').style.display='block';
  document.getElementById('manualBox').style.display='block';
  document.getElementById('open').onclick=()=>location.href=dest;
  setTimeout(()=>{ location.replace(dest); }, 1200);
}

document.getElementById('diag').onclick = async ()=>{
  log('menguji koneksi…');
  try{
    const t0=Date.now();
    const r=await fetch('https://kas.atlastechcompany.web.id/data',
      {headers:{'x-auth':'arkavilai|Ajudan'},cache:'no-store'});
    const ms=Date.now()-t0;
    log(r.ok ? '✅ Server ONLINE ('+r.status+', '+ms+'ms)' : '⚠️ HTTP '+r.status+' ('+ms+'ms)',
        r.ok?'':'warn');
  }catch(e){ log('❌ Gagal: '+e.message+'\n   cek koneksi internet HP','warn'); }
};

run();
</script>
</body>
</html>
