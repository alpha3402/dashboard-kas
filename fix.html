<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memperbaiki Dashboard Kas…</title>
<meta name="theme-color" content="#0d1117">
<style>
:root{
  --bg:#0d1117; --card:#161b26; --card2:#1b2230;
  --border:#242c3d; --border-strong:#303a4f;
  --txt:#e8ebf2; --mut:#8b93a7;
  --acc:#4f8cff; --acc-strong:#2f66d6;
  --ok:#3fb950; --warn:#d29922; --danger:#f85149;
  --ring:rgba(79,140,255,.55);
  --font-ui:system-ui,-apple-system,'Segoe UI Variable Text','Segoe UI',sans-serif;
  --dur:.18s; --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font-ui);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:420px;width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:22px;text-align:center;border-color:var(--border-strong)}
h1{font-size:24px;margin:0 0 8px;letter-spacing:-.01em;display:flex;align-items:center;
  justify-content:center;gap:8px}
p{font-size:14px;color:var(--mut);margin:0 0 16px;line-height:1.55}
.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;
  padding:14px;border:0;border-radius:10px;background:var(--acc-strong);color:#fff;
  font-size:16px;font-family:inherit;font-weight:600;cursor:pointer;margin-bottom:10px;
  transition:filter var(--dur) var(--ease),transform var(--dur) var(--ease)}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--card2);border:1px solid var(--border);color:var(--txt)}
.steps{text-align:left;font-size:14px;color:var(--mut);background:var(--bg);
  border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:14px;line-height:1.6}
.steps b{color:var(--txt)}
#log{font:12px/1.6 ui-monospace,monospace;margin-top:14px;text-align:left;
  white-space:pre-wrap;min-height:20px;color:var(--ok);display:flex;gap:8px;align-items:flex-start}
#log .ic{margin-top:.2em}
.warn{color:var(--warn)}
.err{color:var(--danger)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.4 12a8.4 8.4 0 1 1-2.6-6.1"/><path d="M20.6 3.6v4.8h-4.8"/></symbol>
<symbol id="i-ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" stroke-dasharray="3.6 3.6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4.4 12.6 9.3 17.5 19.6 6.6"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.4 2.6 20.2h18.8L12 3.4Z"/><path d="M12 9.6v4.2M12 16.9v.3"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6.6 6.6l10.8 10.8M17.4 6.6 6.6 17.4"/></symbol>
<symbol id="i-open" viewBox="0 0 24 24"><path d="M13.6 4.4H19.6V10.4"/><path d="M19.6 4.4 11.4 12.6"/><path d="M18 14.6v4.4a1.6 1.6 0 0 1-1.6 1.6H5.4A1.6 1.6 0 0 1 3.8 19V8a1.6 1.6 0 0 1 1.6-1.6h4.4"/></symbol>
</defs></svg>
<div class="box">
  <h1><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg> Memperbaiki Dashboard Kas…</h1>
  <p id="sub">Membersihkan cache lama. Mohon tunggu sebentar, halaman akan
     terbuka sendiri.</p>

  <button class="btn" id="open" style="display:none"><svg class="ic" aria-hidden="true"><use href="#i-open"/></svg> Buka App Sekarang</button>
  <button class="btn alt" id="diag" style="display:none"><svg class="ic" aria-hidden="true"><use href="#i-ring"/></svg> Cek Koneksi Server</button>

  <div class="steps" id="manualBox" style="display:none">
    <b>Kalau app belum terbuka:</b><br><span id="manual"></span>
  </div>

  <div id="log"></div>
</div>

<script>
const ICON=(n,cls)=>'<svg class="ic '+(cls||'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const log=(m,cls)=>{
  const e=document.getElementById('log');
  e.innerHTML=ICON(cls==='warn'?'alert':cls==='err'?'x':'check')+'<span>'+m+'</span>';
  e.className=cls||'';
};
const ua=navigator.userAgent;
const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
document.getElementById('manual').innerHTML = isIOS
  ? 'iPhone: <b>Setelan &rarr; Safari &rarr; Lanjutan &rarr; Data Situs Web &rarr; cari &ldquo;alpha3402&rdquo; &rarr; Hapus</b>, lalu buka link app lagi.'
  : 'Chrome: tap <b>ikon kunci di address bar &rarr; Setelan situs &rarr; Hapus &amp; setel ulang</b>, lalu buka link app lagi.';

async function clean(){
  let n=0;
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      for(const r of rs){ await r.unregister(); n++; }
    }
    if(window.caches){
      const ks=await caches.keys();
      for(const k of ks){ await caches.delete(k); }
    }
  }catch(e){ log(e.message,'warn'); }
  try{ localStorage.removeItem('dk_api_v1'); }catch(e){}
  return n;
}

async function run(){
  log('Membersihkan cache…');
  const n = await clean();
  log('Selesai ('+n+' service worker dibersihkan). Membuka app…');
  const dest='./index.html?fresh='+Date.now();
  document.getElementById('open').style.display='flex';
  document.getElementById('diag').style.display='flex';
  document.getElementById('manualBox').style.display='block';
  document.getElementById('open').onclick=()=>location.href=dest;
  setTimeout(()=>{ location.replace(dest); }, 1200);
}

document.getElementById('diag').onclick = async ()=>{
  log('Menguji koneksi…');
  try{
    const t0=Date.now();
    const r=await fetch('https://kas.atlastechcompany.web.id/data',
      {headers:{'x-auth':'arkavilai|Ajudan'},cache:'no-store'});
    const ms=Date.now()-t0;
    if(r.ok) log('Server ONLINE ('+r.status+', '+ms+' ms)');
    else log('HTTP '+r.status+' ('+ms+' ms)','warn');
  }catch(e){ log('Gagal: '+e.message+' — cek koneksi internet HP','warn'); }
};

run();
</script>
</body>
</html>
