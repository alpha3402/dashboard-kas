<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dashboard Kas — Setup</title>
<meta name="theme-color" content="#0d1117">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0d1117;color:#e6edf3;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:430px;width:100%;background:#161b22;border:1px solid #30363d;
  border-radius:16px;padding:24px}
h1{font-size:18px;margin:0 0 4px;text-align:center}
.sub{font-size:12.5px;color:#8b949e;margin:0 0 18px;text-align:center}
.step{display:flex;align-items:flex-start;gap:10px;font-size:13px;padding:9px 0;
  border-bottom:1px solid #21262d}
.step:last-child{border-bottom:0}
.ico{flex:none;width:20px;text-align:center;font-size:14px}
.step .t{flex:1;line-height:1.45}
.step .t b{color:#e6edf3}
.mut{color:#8b949e}
.ok{color:#3fb950}.warn{color:#d29922}.err{color:#f85149}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:11px;
  background:#238636;color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;
  margin-top:16px}
.btn.alt{background:#21262d;border:1px solid #30363d;color:#e6edf3;margin-top:8px}
.big{text-align:center;font-size:15px;font-weight:700;margin:14px 0 0}
.note{font-size:11.5px;color:#8b949e;text-align:center;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div class="box">
  <h1>🔧 Dashboard Kas</h1>
  <p class="sub">Menyiapkan aplikasi. Mohon tunggu…</p>

  <div id="steps">
    <div class="step" id="s1"><div class="ico">◌</div><div class="t">Bersihkan cache lama (service worker)</div></div>
    <div class="step" id="s2"><div class="ico">◌</div><div class="t">Perbaiki sesi login</div></div>
    <div class="step" id="s3"><div class="ico">◌</div><div class="t">Cek koneksi ke server</div></div>
    <div class="step" id="s4"><div class="ico">◌</div><div class="t">Buka dashboard</div></div>
  </div>

  <div class="big" id="big"></div>
  <button class="btn" id="go" style="display:none">Buka Dashboard Sekarang</button>
  <button class="btn alt" id="retry" style="display:none">Coba Lagi</button>

  <p class="note" id="note"></p>
</div>

<script>
const API='https://kas.atlastechcompany.web.id';
const K_ME='dk_me_v1', K_API='dk_api_v1';
const set=(id,ico,html,cls)=>{
  const s=document.getElementById(id);
  s.querySelector('.ico').textContent=ico;
  s.querySelector('.ico').className='ico '+(cls||'');
  if(html)s.querySelector('.t').innerHTML=html;
};

async function cleanup(){
  let n=0;
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      for(const r of rs){ try{ await r.unregister(); n++; }catch(e){} }
    }
  }catch(e){}
  let c=0;
  try{ if(window.caches){ const ks=await caches.keys(); for(const k of ks){ try{ await caches.delete(k); c++; }catch(e){} } } }catch(e){}
  try{ localStorage.removeItem(K_API); }catch(e){}
  return {sw:n,caches:c};
}
function healSession(){
  try{
    const m=JSON.parse(localStorage.getItem(K_ME)||'null');
    if(!m||!m.un||!m.role) return {ok:false,msg:'belum login'};
    const good=m.un+'|'+m.role;
    if(m.token!==good){ m.token=good; localStorage.setItem(K_ME,JSON.stringify(m)); }
    return {ok:true,msg:m.un+' ('+m.role+')'};
  }catch(e){ return {ok:false,msg:'gagal baca sesi'} }
}
async function testAPI(){
  const t0=Date.now();
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),12000);
  try{
    const r=await fetch(API+'/data',{cache:'no-store',signal:ctrl.signal});
    clearTimeout(to);
    return {ok:r.ok,status:r.status,ms:Date.now()-t0};
  }catch(e){ clearTimeout(to); return {ok:false,err:e.name+': '+e.message,ms:Date.now()-t0} }
}

/* Kirim kondisi HP ke server supaya bisa didiagnosa dari jarak jauh
   (tanpa perlu lihat layar HP). Gagal kirim = tidak masalah, diabaikan. */
async function sendReport(extra){
  try{
    const ls={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      const v=localStorage.getItem(k)||'';
      if(k==='dk_me_v1'){
        let parsed=null; try{parsed=JSON.parse(v)}catch(e){}
        ls[k]=parsed?{un:parsed.un,role:parsed.role,tokenFormat:(parsed.token===(parsed.un+'|'+parsed.role)?'ok':(parsed.token?'wrong':'missing'))}:v;
      }else if(k.indexOf('foto')>=0||k.length>200){ ls[k]='['+v.length+' chars]'; }
      else { ls[k]=v; }
    }
    let sw=0,cachesN=0,startHref='';
    try{ if('serviceWorker' in navigator){ const rs=await navigator.serviceWorker.getRegistrations(); sw=rs.length;
      startHref=(rs[0]&&rs[0].active&&rs[0].active.scriptURL)||''; } }catch(e){}
    try{ if(window.caches){ cachesN=(await caches.keys()).length; } }catch(e){}
    const body={
      ua:navigator.userAgent,
      href:location.href,
      online:navigator.onLine,
      screen:screen.width+'x'+screen.height,
      dpr:window.devicePixelRatio,
      sw_registered:sw, sw_script:startHref, caches:cachesN,
      standalone:window.matchMedia('(display-mode:standalone)').matches,
      ls:ls,
      api_test:window.__apiTest||null,
      extra:extra||null,
      ts:Date.now()
    };
    await fetch(API+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});
  }catch(e){}
}

async function run(){
  document.getElementById('go').style.display='none';
  document.getElementById('retry').style.display='none';
  document.getElementById('big').textContent='';

  // laporkan kondisi ASLI dulu (sebelum dibersihkan) — ini yg penting utk diagnosa
  await sendReport({phase:'before'});

  // 1
  set('s1','◌','Bersihkan cache lama…');
  const r1=await cleanup();
  set('s1','✅','Cache dibersihkan &nbsp;<span class="mut">('+r1.sw+' SW, '+r1.caches+' cache)</span>','ok');

  // 2
  set('s2','◌','Perbaiki sesi login…');
  const r2=healSession();
  if(r2.ok) set('s2','✅','Sesi login OK &nbsp;<span class="mut">('+r2.msg+')</span>','ok');
  else set('s2','⚠️','Sesi: <span class="mut">'+r2.msg+' — kamu akan diminta login</span>','warn');

  // 3
  set('s3','◌','Cek koneksi ke server…');
  const r3=await testAPI();
  if(r3.ok) set('s3','✅','Server ONLINE &nbsp;<span class="mut">('+r3.status+', '+r3.ms+'ms)</span>','ok');
  else set('s3','⚠️','Server: <span class="mut">'+(r3.status?('HTTP '+r3.status):r3.err)+' — data tetap aman lokal</span>','warn');

  // 4
  set('s4','✅','Siap dibuka','ok');

  // laporkan kondisi HP ke server (untuk diagnosa jarak jauh)
  window.__apiTest=r3;
  await sendReport({phase:'complete'});

  const dest='./index.html?fresh='+Date.now();
  document.getElementById('go').style.display='block';
  document.getElementById('go').onclick=()=>location.replace(dest);

  if(r3.ok){
    document.getElementById('big').innerHTML='<span class="ok">✓ Semua beres — membuka dashboard…</span>';
    setTimeout(()=>location.replace(dest),1400);
  }else{
    document.getElementById('big').innerHTML='<span class="warn">Server belum terjangkau dari HP ini</span>';
    document.getElementById('retry').style.display='block';
    document.getElementById('retry').onclick=run;
    document.getElementById('note').innerHTML=
      'Cek: (1) internet HP nyala? (2) coba matikan WiFi lalu pakai data seluler (atau sebaliknya)?'+
      '<br>Data kamu <b>tetap tersimpan lokal</b>, tidak ada yang hilang.';
  }
}

if('serviceWorker' in navigator){
  try{ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister().catch(()=>{}))); }catch(e){}
}
run();
</script>
</body>
</html>
